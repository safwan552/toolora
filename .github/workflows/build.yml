name: Build Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Lint
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
        run: npm run lint
      - name: Next.js build
        run: npm run build
